<html lang="en">
<head>

<title>TomatoQuest — Grow • Play • Earn</title>

<style>
/* ==========================================================================
   TomatoQuest — single-file earning game web app (demo)
   All CSS is self-contained. No external fonts, images or frameworks.
   Design: premium dark "magic garden" game theme, mobile-first.
   Older-Android note: critical properties are declared twice — first as a
   literal fallback, then enhanced with rgba()/gradient values. CSS custom
   properties are only used for non-critical accents.
   ========================================================================== */

/* ---------- reset & base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: #0b0614;
  background: linear-gradient(180deg, #100a1e 0%, #0b0614 45%, #130922 100%);
  color: #f4f1ff;
  color: var(--text, #f4f1ff);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  font-size: 15px;
  line-height: 1.45;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
button, input, select, textarea { font-family: inherit; font-size: inherit; }
button, .btn, .q-card, .char-cell { touch-action: manipulation; }
button { cursor: pointer; }
h1, h2, h3, h4, p { margin: 0; }
svg { display: block; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 99px; }
::selection { background: rgba(255,157,46,.35); }

/* ---------- ambient background glows (cheap: no filter blur) ---------- */
.bg-fx { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.bg-fx i { position: absolute; border-radius: 50%; }
.bg-fx .g1 { width: 420px; height: 420px; top: -160px; left: -130px;
  background: radial-gradient(circle, rgba(255,90,69,.34) 0%, rgba(255,90,69,0) 70%);
  animation: drift 16s ease-in-out infinite alternate; }
.bg-fx .g2 { width: 400px; height: 400px; top: 32%; right: -170px;
  background: radial-gradient(circle, rgba(124,58,237,.30) 0%, rgba(124,58,237,0) 70%);
  animation: drift 19s ease-in-out infinite alternate-reverse; }
.bg-fx .g3 { width: 340px; height: 340px; bottom: -150px; left: -110px;
  background: radial-gradient(circle, rgba(14,165,160,.16) 0%, rgba(14,165,160,0) 70%);
  animation: drift 22s ease-in-out infinite alternate; }
@keyframes drift { from { transform: translate3d(0,0,0); } to { transform: translate3d(26px,34px,0); } }

/* ---------- layout ---------- */
#app { position: relative; z-index: 1; }
.view {
  max-width: 520px;
  margin: 0 auto;
  padding: 14px 16px 118px;
  padding-bottom: 118px;
}
.view.anim > * { animation: rise .32s cubic-bezier(.2,.8,.3,1) both; }
.view.anim > *:nth-child(2) { animation-delay: .035s; }
.view.anim > *:nth-child(3) { animation-delay: .07s; }
.view.anim > *:nth-child(4) { animation-delay: .105s; }
.view.anim > *:nth-child(5) { animation-delay: .14s; }
.view.anim > *:nth-child(6) { animation-delay: .175s; }
.view.anim > *:nth-child(7) { animation-delay: .21s; }
.view.anim > *:nth-child(n+8) { animation-delay: .24s; }
@keyframes rise { from { opacity: 0; transform: translate3d(0,12px,0); } to { opacity: 1; transform: none; } }

/* ---------- headers ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.userchip { display: flex; align-items: center; gap: 11px; min-width: 0; }
.avatar {
  width: 44px; height: 44px; border-radius: 15px; flex: none;
  background: linear-gradient(135deg, #2a1b4a, #1a1030);
  border: 1px solid rgba(255,255,255,.14);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 18px rgba(0,0,0,.35);
}
.u-name { font-weight: 800; font-size: 15.5px; letter-spacing: .2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.u-id { font-size: 11.5px; color: #a89fc9; color: var(--muted, #a89fc9); font-weight: 600; letter-spacing: .4px; }
.iconbtn {
  position: relative; width: 42px; height: 42px; border-radius: 14px; flex: none;
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
  color: #cfc7e8; display: flex; align-items: center; justify-content: center;
  transition: transform .12s, background .2s;
}
.iconbtn:active { transform: scale(.92); }
.iconbtn .dot {
  position: absolute; top: 9px; right: 10px; width: 8px; height: 8px; border-radius: 50%;
  background: #ff5757; border: 2px solid #150d26; box-shadow: 0 0 8px rgba(255,87,87,.8);
}
.pagehead { margin: 4px 0 14px; }
.pagehead h2 { font-size: 21px; font-weight: 800; letter-spacing: .2px; }
.pagehead p { font-size: 12.5px; color: #a89fc9; color: var(--muted, #a89fc9); margin-top: 3px; }
.backhead { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.backhead h2 { font-size: 19px; font-weight: 800; flex: 1; }

/* ---------- cards ---------- */
.card {
  background: #171029;
  background: linear-gradient(170deg, rgba(255,255,255,.065) 0%, rgba(255,255,255,.028) 100%), #150e26;
  border: 1px solid rgba(255,255,255,.085);
  border-radius: 20px;
  padding: 14px 14px;
  margin-bottom: 12px;
  position: relative;
}
.card-title { font-size: 13.5px; font-weight: 800; letter-spacing: .2px; }
.card-val { font-size: 13px; font-weight: 800; color: #ffd76b; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.linkbtn {
  background: none; border: 0; padding: 4px 2px; color: #ffb45c; font-weight: 700; font-size: 12.5px;
  display: inline-flex; align-items: center; gap: 3px;
}

/* ---------- balance card ---------- */
.balance-card {
  border-radius: 24px; padding: 1.5px; margin-bottom: 14px; border: 0;
  background: linear-gradient(135deg, rgba(255,201,60,.85) 0%, rgba(255,107,74,.6) 38%, rgba(160,107,255,.55) 100%);
  box-shadow: 0 14px 42px rgba(255,122,60,.18);
  text-align: left; width: 100%; display: block; color: inherit;
}
.balance-inner {
  border-radius: 23px; padding: 18px 16px 14px; position: relative; overflow: hidden;
  background: #150d26;
  background: linear-gradient(168deg, #1d1233 0%, #130c21 70%);
}
.balance-inner .p { position: absolute; border-radius: 50%; pointer-events: none; opacity: .5; }
.balance-inner .p1 { width: 90px; height: 90px; top: -34px; right: -22px; background: radial-gradient(circle, rgba(255,201,60,.35) 0%, rgba(255,201,60,0) 70%); animation: floaty 6s ease-in-out infinite; }
.balance-inner .p2 { width: 70px; height: 70px; bottom: -20px; left: 26%; background: radial-gradient(circle, rgba(255,107,74,.3) 0%, rgba(255,107,74,0) 70%); animation: floaty 7.5s ease-in-out infinite reverse; }
.balance-inner .p3 { width: 46px; height: 46px; top: 30%; left: -16px; background: radial-gradient(circle, rgba(160,107,255,.32) 0%, rgba(160,107,255,0) 70%); animation: floaty 8.5s ease-in-out infinite; }
@keyframes floaty { 0%,100% { transform: translate3d(0,0,0); } 50% { transform: translate3d(4px,-9px,0); } }
.bc-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.bc-label { font-size: 12px; font-weight: 700; color: #b3a9d6; color: var(--muted, #b3a9d6); letter-spacing: .8px; text-transform: uppercase; }
.bc-amount {
  font-size: 38px; font-weight: 800; letter-spacing: -.5px; line-height: 1.15;
  color: #ffc93c;
  background: linear-gradient(120deg, #ffe9a8 5%, #ffc93c 45%, #ff9d2e 95%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  font-variant-numeric: tabular-nums;
}
.bc-stats { display: flex; align-items: center; margin-top: 12px; }
.bc-stat { flex: 1; min-width: 0; }
.bc-stat span { display: block; font-size: 11px; font-weight: 700; color: #9d93c2; letter-spacing: .4px; text-transform: uppercase; }
.bc-stat b { display: block; font-size: 15.5px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }
.bc-sep { width: 1px; height: 30px; background: rgba(255,255,255,.12); margin: 0 12px; flex: none; }
.bc-foot {
  display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 13px;
  padding-top: 11px; border-top: 1px solid rgba(255,255,255,.09);
  font-size: 12.5px; font-weight: 800; color: #ffd76b;
}

/* ---------- demo chip ---------- */
.demo-chip {
  display: inline-flex; align-items: center; gap: 4px; flex: none;
  font-size: 9.5px; font-weight: 800; letter-spacing: 1px;
  padding: 3px 8px; border-radius: 99px;
  color: #ffcf7d; background: rgba(255,178,60,.1);
  border: 1px dashed rgba(255,178,60,.5);
}

/* ---------- progress bars ---------- */
.bar { height: 10px; border-radius: 99px; background: rgba(255,255,255,.09); overflow: hidden; position: relative; margin: 10px 0 6px; }
.bar.slim { height: 7px; margin: 8px 0 4px; }
.bar-fill {
  height: 100%; border-radius: 99px; width: 0%;
  background: linear-gradient(90deg, #ff5a45, #ff9d2e 60%, #ffc93c);
  transition: width .6s cubic-bezier(.2,.8,.3,1);
  position: relative; min-width: 0;
}
.bar-fill.gold { background: linear-gradient(90deg, #ffc93c, #ff8a00); }
.bar-fill.green { background: linear-gradient(90deg, #3ddc84, #0e9f5c); }
.bar-fill.purple { background: linear-gradient(90deg, #a06bff, #6d3ee0); }
.bar-fill.live::after {
  content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(100deg, transparent 25%, rgba(255,255,255,.4) 50%, transparent 75%);
  transform: translateX(-100%);
  animation: shimmer 2.4s ease-in-out infinite;
}
@keyframes shimmer { to { transform: translateX(100%); } }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; border-radius: 14px; padding: 12px 18px;
  font-weight: 800; font-size: 14px; letter-spacing: .2px; color: #fff;
  background: rgba(255,255,255,.09);
  transition: transform .12s, box-shadow .25s, filter .2s, opacity .2s;
  text-align: center;
}
.btn:active { transform: scale(.955); }
.btn[disabled] { opacity: .45; pointer-events: none; filter: grayscale(.4); }
.btn-primary { background: linear-gradient(135deg, #ff5a45, #ff9d2e); box-shadow: 0 10px 26px rgba(255,110,60,.32); }
.btn-gold { background: linear-gradient(135deg, #ffc93c, #ff8a00); color: #3a1d00; box-shadow: 0 10px 26px rgba(255,170,40,.28); }
.btn-green { background: linear-gradient(135deg, #2ed380, #0e9f5c); box-shadow: 0 10px 26px rgba(46,211,128,.26); }
.btn-purple { background: linear-gradient(135deg, #a06bff, #6d3ee0); box-shadow: 0 10px 26px rgba(140,90,240,.3); }
.btn-outline { background: transparent; border: 1px solid rgba(255,255,255,.18); }
.btn-block { width: 100%; }
.btn-sm { padding: 8px 13px; font-size: 12.5px; border-radius: 11px; }

/* ---------- watch ad CTA ---------- */
.watch-cta {
  display: flex; align-items: center; gap: 14px; width: 100%;
  border: 0; border-radius: 22px; padding: 15px 16px;
  background: linear-gradient(135deg, #ff5a45 0%, #ff7a3c 55%, #ff9d2e 100%);
  color: #fff; text-align: left; margin-bottom: 14px;
  box-shadow: 0 14px 36px rgba(255,110,60,.38), inset 0 1px 0 rgba(255,255,255,.28);
  animation: ctaGlow 2.8s ease-in-out infinite;
  transition: transform .12s;
}
.watch-cta:active { transform: scale(.975); }
.watch-cta[disabled] { animation: none; filter: grayscale(.55); opacity: .6; }
@keyframes ctaGlow {
  0%, 100% { box-shadow: 0 12px 30px rgba(255,110,60,.34), inset 0 1px 0 rgba(255,255,255,.28); }
  50% { box-shadow: 0 16px 44px rgba(255,130,50,.5), inset 0 1px 0 rgba(255,255,255,.28); }
}
.wa-ico {
  width: 46px; height: 46px; border-radius: 16px; flex: none;
  background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.28);
  display: flex; align-items: center; justify-content: center;
}
.wa-ico .ic { width: 24px; height: 24px; }
.wa-text { flex: 1; min-width: 0; }
.wa-text b { display: block; font-size: 16.5px; font-weight: 800; letter-spacing: 1.2px; }
.wa-text small { display: block; font-size: 11.5px; font-weight: 700; opacity: .92; margin-top: 1px; }

/* ---------- quick action grid (home) ---------- */
.quick-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
.q-card {
  flex: 1 1 30%; min-width: 96px;
  background: #171029;
  background: linear-gradient(170deg, rgba(255,255,255,.065), rgba(255,255,255,.028)), #150e26;
  border: 1px solid rgba(255,255,255,.085); border-radius: 18px;
  padding: 13px 10px; text-align: center; color: inherit;
  display: flex; flex-direction: column; align-items: center; gap: 7px;
  transition: transform .12s, border-color .2s;
}
.q-card:active { transform: scale(.95); }
.q-ico {
  width: 42px; height: 42px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
}
.q-ico .ic { width: 22px; height: 22px; }
.q-card b { font-size: 12px; font-weight: 800; }
.q-card small { font-size: 10.5px; color: #a89fc9; color: var(--muted, #a89fc9); font-weight: 700; }
.q-card.glow { border-color: rgba(61,220,132,.4); box-shadow: 0 0 20px rgba(61,220,132,.12); }

/* ---------- home character strip ---------- */
.char-mini { display: flex; align-items: center; gap: 13px; }
.cm-art {
  width: 62px; height: 62px; border-radius: 18px; flex: none;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid rgba(255,255,255,.12);
}
.cm-info { flex: 1; min-width: 0; }
.cm-name { font-size: 15.5px; font-weight: 800; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.cm-boost { font-size: 12px; font-weight: 700; color: #ffd76b; margin-top: 2px; display: flex; align-items: center; gap: 5px; }
.cm-boost .ic { width: 14px; height: 14px; }

/* ---------- badges & chips ---------- */
.lvl-badge {
  display: inline-flex; align-items: center; font-size: 10px; font-weight: 800; letter-spacing: .5px;
  padding: 2.5px 8px; border-radius: 99px;
  background: rgba(160,107,255,.16); color: #c9a8ff; border: 1px solid rgba(160,107,255,.4);
}
.rarity-tag {
  display: inline-flex; align-items: center; font-size: 10px; font-weight: 800; letter-spacing: .6px;
  padding: 2.5px 9px; border-radius: 99px; text-transform: uppercase;
}
.chip {
  display: inline-flex; align-items: center; gap: 4px; flex: none;
  font-size: 10.5px; font-weight: 800; letter-spacing: .3px;
  padding: 4px 10px; border-radius: 99px; border: 1px solid;
}
.chip .ic { width: 12px; height: 12px; }
.chip.ok     { color: #3ddc84; border-color: rgba(61,220,132,.35); background: rgba(61,220,132,.1); }
.chip.warn   { color: #ffc93c; border-color: rgba(255,201,60,.35); background: rgba(255,201,60,.1); }
.chip.info   { color: #7fb1ff; border-color: rgba(127,177,255,.35); background: rgba(127,177,255,.1); }
.chip.red    { color: #ff7d7d; border-color: rgba(255,125,125,.35); background: rgba(255,125,125,.1); }
.chip.dim    { color: #9d93c2; border-color: rgba(157,147,194,.3); background: rgba(157,147,194,.08); }

/* ---------- characters screen ---------- */
.char-grid { display: flex; flex-wrap: wrap; gap: 12px; }
.char-cell {
  width: calc(50% - 6px);
  background: #171029;
  background: linear-gradient(170deg, rgba(255,255,255,.06), rgba(255,255,255,.025)), #140d24;
  border: 1px solid rgba(255,255,255,.09);
  border-radius: 20px; padding: 11px; position: relative;
  display: flex; flex-direction: column; gap: 10px;
  transition: transform .12s, border-color .25s, box-shadow .25s;
}
.char-cell.active { border-color: rgba(61,220,132,.55); box-shadow: 0 0 26px rgba(61,220,132,.13); }
.char-cell.locked .cc-art { filter: grayscale(.75); opacity: .55; }
.cc-art {
  height: 122px; border-radius: 15px; position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid rgba(255,255,255,.08);
}
.cc-ribbon {
  position: absolute; top: 8px; right: 8px; z-index: 2;
  font-size: 9px; font-weight: 800; letter-spacing: 1px;
  padding: 3px 8px; border-radius: 99px;
  background: rgba(10,5,20,.72); border: 1px solid rgba(255,255,255,.2); color: #fff;
}
.cc-ribbon.on { background: linear-gradient(135deg, #2ed380, #0e9f5c); border-color: transparent; }
.cc-name { font-size: 14.5px; font-weight: 800; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.cc-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 5px; }
.cc-boost { font-size: 11.5px; font-weight: 700; color: #ffd76b; display: flex; align-items: center; gap: 5px; margin-top: 7px; }
.cc-boost .ic { width: 13px; height: 13px; }
.cc-pips { display: flex; gap: 4px; margin-top: 8px; }
.cc-pips i { width: 100%; height: 4px; border-radius: 99px; background: rgba(255,255,255,.12); flex: 1; }
.cc-actions { display: flex; gap: 7px; margin-top: 2px; }
.cc-actions .btn { flex: 1; padding: 9px 6px; font-size: 12px; border-radius: 11px; }
.cc-price { display: flex; align-items: center; gap: 5px; font-weight: 800; font-size: 12.5px; color: #ffd76b; }
.cc-req { font-size: 10.5px; color: #9d93c2; font-weight: 700; margin-top: 7px; display: flex; align-items: center; gap: 5px; }
.cc-req .ic { width: 12px; height: 12px; }

/* ---------- earn screen ---------- */
.earn-hero-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.eh-ico {
  width: 46px; height: 46px; border-radius: 15px; flex: none;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, rgba(255,90,69,.25), rgba(255,157,46,.25));
  border: 1px solid rgba(255,157,46,.35); color: #ffb45c;
}
.kv { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; }
.kv span { font-size: 12.5px; font-weight: 700; color: #a89fc9; color: var(--muted, #a89fc9); }
.kv b { font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
.kv-divider { height: 1px; background: rgba(255,255,255,.07); margin: 4px 0; }
.fineprint { font-size: 11px; color: #8d84ad; line-height: 1.55; margin-top: 9px; }
.day-chips { display: flex; gap: 6px; margin: 11px 0 4px; }
.day-chip {
  flex: 1; min-width: 0; text-align: center; border-radius: 13px; padding: 8px 2px 7px;
  background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.09);
}
.day-chip span { display: block; font-size: 9.5px; font-weight: 800; color: #9d93c2; letter-spacing: .5px; }
.day-chip b { display: block; font-size: 10.5px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }
.day-chip.done { background: rgba(61,220,132,.12); border-color: rgba(61,220,132,.4); }
.day-chip.done span, .day-chip.done b { color: #3ddc84; }
.day-chip.cur { background: rgba(255,157,46,.13); border-color: rgba(255,157,46,.55); box-shadow: 0 0 14px rgba(255,157,46,.18); animation: pulseSoft 2s ease-in-out infinite; }
.day-chip.cur span, .day-chip.cur b { color: #ffb45c; }
@keyframes pulseSoft { 0%,100% { box-shadow: 0 0 10px rgba(255,157,46,.14); } 50% { box-shadow: 0 0 20px rgba(255,157,46,.3); } }
.streak-hero { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
.streak-flame {
  width: 54px; height: 54px; border-radius: 17px; flex: none;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, rgba(255,138,0,.22), rgba(255,69,69,.22));
  border: 1px solid rgba(255,120,60,.4); color: #ff9d2e;
}
.streak-flame .ic { width: 27px; height: 27px; }
.streak-num { font-size: 25px; font-weight: 800; line-height: 1.1; }
.streak-sub { font-size: 11.5px; color: #a89fc9; color: var(--muted, #a89fc9); font-weight: 700; }

/* ---------- toast ---------- */
#toast-root {
  position: fixed; left: 14px; right: 14px; z-index: 80;

}

function pad2(n) { return (n < 10 ? "0" : "") + n; }
function round2(n) { return Math.round(n * 100) / 100; }
function clamp(n, lo, hi) { return n < lo ? lo : (n > hi ? hi : n); }

/* money formatter with grouping: 1234.5 -> "৳1,234.50" */
function money(n) {
  if (!isFinite(n)) { n = 0; }
  var neg = n < 0;
  var v = Math.round(Math.abs(n) * 100) / 100;
  var parts = v.toFixed(2).split(".");
  var ip = parts[0], grouped = "";
  while (ip.length > 3) { grouped = "," + ip.slice(-3) + grouped; ip = ip.slice(0, ip.length - 3); }
  grouped = ip + grouped;
  return (neg ? "-" : "") + APP_CONFIG.currency.symbol + grouped + "." + parts[1];
}

function esc(s) {
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

var UID_SEED = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function uid(prefix) {
  var s = "";
  for (var i = 0; i < 6; i++) { s += UID_SEED.charAt(Math.floor(Math.random() * UID_SEED.length)); }
  return (prefix ? prefix + "-" : "") + s;
}

var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDateTime(ts) {
  var d = new Date(ts);
  return MONTHS[d.getMonth()] + " " + d.getDate() + ", " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}
function fmtDate(ts) {
  var d = new Date(ts);
  return MONTHS[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
}
/* "5h 12m" style countdown for remaining time */
function fmtDur(ms) {
  if (ms < 0) { ms = 0; }
  var m = Math.floor(ms / 60000);
  var h = Math.floor(m / 60); m = m % 60;
  if (h > 0) { return h + "h " + m + "m"; }
  if (m > 0) { return m + "m"; }
  return Math.max(1, Math.floor(ms / 1000)) + "s";
}
function msUntilMidnight(nowTs) {
  var d = new Date(nowTs);
  var end = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1, 0, 0, 0, 0).getTime();
  return end - nowTs;
}

function starPath(x, y, r) {
  var k = 0.32;
  return "M" + x + " " + (y - r) +
    " L" + (x + r * k) + " " + (y - r * k) + " L" + (x + r) + " " + y +
    " L" + (x + r * k) + " " + (y + r * k) + " L" + x + " " + (y + r) +
    " L" + (x - r * k) + " " + (y + r * k) + " L" + (x - r) + " " + y +
    " L" + (x - r * k) + " " + (y - r * k) + " Z";
}

/* ==========================================================================
 * 5. Clock — demo-aware time
 * --------------------------------------------------------------------------
 * All "day" logic (daily bonus, streaks, ad limits) runs through Clock so
 * the DEMO admin can simulate the next day for testing.
 *
 * SECURITY: in production, "day" boundaries and eligibility MUST come from
 * the server clock, never the device clock (clients can change it).
 * ========================================================================== */
var Clock = {
  now: function () { return Date.now() + (AppState && AppState.demo ? AppState.demo.timeOffsetMs : 0); },
  dayKeyAt: function (ts) {
    var d = new Date(ts);
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  },
  todayKey: function () { return Clock.dayKeyAt(Clock.now()); },
  yesterdayKey: function () { return Clock.dayKeyAt(Clock.now() - 86400000); },
  /* last 7 day-keys, oldest first */
  weekKeys: function () {
    var out = [], t = Clock.now();
    for (var i = 6; i >= 0; i--) { out.push(Clock.dayKeyAt(t - i * 86400000)); }
    return out;
  }
};

/* ==========================================================================
 * 6. Storage — safe localStorage wrapper
 * --------------------------------------------------------------------------
 * Falls back to in-memory storage when localStorage is unavailable (some
 * WebViews / private modes). NEVER use this for anything security-relevant.
 * ========================================================================== */
var Storage = (function () {
  var mem = {};
  var ok = false;
  try {
    var k = "__tq_test__";
    window.localStorage.setItem(k, "1");
    window.localStorage.removeItem(k);
    ok = true;
  } catch (e) { ok = false; }

  return {
    persistent: ok,
    get: function (key, fallback) {
      try {
        var raw = ok ? window.localStorage.getItem(key) : (mem[key] || null);
        if (raw === null || raw === undefined) { return fallback; }
        return JSON.parse(raw);
      } catch (e) { return fallback; }
    },
    set: function (key, value) {
      try {
        var raw = JSON.stringify(value);
        if (ok) { window.localStorage.setItem(key, raw); } else { mem[key] = raw; }
      } catch (e) { /* quota / private mode — keep going with memory copy */ }
    },
    remove: function (key) {
      try { if (ok) { window.localStorage.removeItem(key); } } catch (e) {}
      delete mem[key];
    },
    clearAll: function () {
      try { if (ok) { window.localStorage.removeItem(APP_CONFIG.demo.storageKey); } } catch (e) {}
      delete mem[APP_CONFIG.demo.storageKey];
    }
  };
})();

/* ==========================================================================
 * 7. DEMO MODE — local UI state (localStorage ONLY)
 * ==========================================================================
 * >>> DEMO ONLY — production balances must be server-side. <<<
 *
 * Everything in DemoState exists purely so the interface can be tested in
 * a browser with no backend: a demo balance, character ownership, streaks,
 * daily claims, simulated referral counts and a demo transaction list.
 *
 * It is trivially editable by the user (devtools) and holds NO monetary
 * value. In production this entire object is replaced by API calls to the
 * Railway backend (which writes to Firestore):
 *
 *     Telegram Mini App -> index.html (this UI) -> Railway API -> Firestore
 *
 * The shape of the state intentionally mirrors what the backend will
 * return, so swapping DemoState.load()/save() for ApiClient calls later
 * requires no UI changes.
 * ========================================================================== */
var AppState = null; /* loaded by DemoState.load() */

var DemoState = {

  /* fresh demo state — everything starts at zero / empty (no fake earnings) */
  defaults: function () {
    var now = Date.now();
    return {
      v: 1,                                   /* state schema version       */
      createdAt: now,
      user: {
        id: uid("TQ"),
        name: "Explorer",                     /* replaced by Telegram later */
        joinedAt: now
      },
      wallet: {
        pending: 0,                           /* awaiting verification      */
        withdrawable: 0,                      /* verified, spendable        */
        lifetimeVerified: 0                   /* all-time verified earnings */
      },
      characters: {
        activeId: "novice",
        owned: { novice: { level: 1 } }       /* starter character is free  */
      },
      ads: { day: "", count: 0 },             /* daily ad counter           */
      bonus: { lastClaimDay: "", dayIndex: 0 },/* 7-day daily bonus track   */
      streak: {
        current: 0, best: 0,
        lastDay: "", startDay: "",
        days: {},                             /* dayKey -> qualified        */
        milestones: {}                        /* milestone day -> startDay  */
      },
      challenge: { day: "", claimed: false }, /* daily challenge            */
      referral: {
        bonusesClaimed: []                    /* claimed bonus-stage indexes*/
      },
      demoRef: { invited: 0, active: 0, activeToday: 0 }, /* SIMULATED counts */
      transactions: [],                       /* demo transaction history   */
      withdrawals: [],                        /* demo withdrawal requests   */
      settings: { notifications: true, language: "en", lastNotifSeen: 0 },
      demo: { timeOffsetMs: 0 }               /* DEMO admin "next day" sim  */
    };
  },

  load: function () {
    var saved = Storage.get(APP_CONFIG.demo.storageKey, null);
    if (saved && saved.v === 1) {
      /* merge with defaults so new config keys never break old saves */
      var base = DemoState.defaults();
      var merged = DemoState.merge(base, saved);
      AppState = merged;
    } else {
      AppState = DemoState.defaults();
      DemoState.save();
    }
  },

  /* shallow-deep merge: saved values win, missing keys fall back */
  merge: function (base, saved) {
    for (var k in saved) {
      if (!saved.hasOwnProperty(k)) { continue; }
      if (saved[k] && typeof saved[k] === "object" && !Array.isArray(saved[k]) &&
          base[k] && typeof base[k] === "object" && !Array.isArray(base[k])) {
        base[k] = DemoState.merge(base[k], saved[k]);
      } else {
        base[k] = saved[k];
      }
    }
    return base;
  },

  /* DEMO ONLY — persists local UI state to localStorage. */
  save: function () {
    Storage.set(APP_CONFIG.demo.storageKey, AppState);
  },

  reset: function () {
    Storage.clearAll();
    AppState = DemoState.defaults();
    DemoState.save();
  }
};

/* commit(): single helper used after every state mutation.
 * Saves demo state and refreshes the visible UI. */
function commit() {
  DemoState.save();
  UI.refresh();
}

/* ==========================================================================
 * 8. ApiClient — placeholder for the future backend
 * --------------------------------------------------------------------------
 * NOT USED YET. When the Railway backend is deployed, set
 * APP_CONFIG.apiBaseUrl (public URL only — never a secret) and replace the
 * DemoState calls inside the services with ApiClient calls, e.g.:
 *
 *   WalletService.balances = function () {
 *     return ApiClient.request("GET", "/wallet");
 *   };
 *
 * All server responses must be validated here before rendering.
 * ========================================================================== */
var ApiClient = {
  isConfigured: function () { return !!APP_CONFIG.apiBaseUrl; },

  request: function (method, path, data) {
    return new Promise(function (resolve, reject) {
      if (!ApiClient.isConfigured()) {
        reject(new Error("API not configured — this build runs in local demo mode."));
        return;
      }
      /* XMLHttpRequest keeps this compatible with very old WebViews. */
      try {
        var xhr = new XMLHttpRequest();
        xhr.open(method, APP_CONFIG.apiBaseUrl + path, true);
        xhr.setRequestHeader("Content-Type", "application/json");
        /* TODO: attach the Telegram Mini App initData signature header so
         * the backend can authenticate the user (never a raw bot token). */
        xhr.onreadystatechange = function () {
          if (xhr.readyState !== 4) { return; }
          if (xhr.status >= 200 && xhr.status < 300) {
            try { resolve(JSON.parse(xhr.responseText)); }
            catch (e) { reject(new Error("Bad JSON from server")); }
          } else {
            reject(new Error("Server error " + xhr.status));
          }
        };
        xhr.send(data ? JSON.stringify(data) : null);
      } catch (e) { reject(e); }
    });
  }
};

/* ==========================================================================
 * 12. WalletService — balances, credits, transactions (DEMO)
 * --------------------------------------------------------------------------
 * DEMO ONLY — production balances must be server-side.
 * The real flow: ad network -> backend verification -> Firestore credit.
 * This local simulation mirrors that flow (pending -> verified) so the UI
 * can be tested without a backend.
 * ========================================================================== */
var EARNING_TYPES = {
  "ad_reward": true, "daily_bonus": true, "streak_bonus": true,
  "challenge_bonus": true, "referral_bonus": true, "demo_fund": true
};

var TX_META = {
  "ad_reward":          { label: "Ad reward",         icon: "play",   sign: +1 },
  "daily_bonus":        { label: "Daily bonus",       icon: "gift",   sign: +1 },
  "streak_bonus":       { label: "Streak bonus",      icon: "flame",  sign: +1 },
  "challenge_bonus":    { label: "Challenge reward",  icon: "target", sign: +1 },
  "referral_bonus":     { label: "Referral reward",   icon: "users",  sign: +1 },
  "demo_fund":          { label: "Demo test funds",   icon: "coin",   sign: +1 },
  "character_purchase": { label: "Character purchase", icon: "magic", sign: -1 },
  "character_upgrade":  { label: "Character upgrade",  icon: "magic", sign: -1 },
  "withdrawal":         { label: "Withdrawal",        icon: "wallet", sign: -1 }
};

var WalletService = {

  balances: function () {
    return {
      pending: AppState.wallet.pending,
      withdrawable: AppState.wallet.withdrawable,
      total: round2(AppState.wallet.pending + AppState.wallet.withdrawable)
    };
  },

  totalVerified: function () { return AppState.wallet.lifetimeVerified; },

  /* today's earned total (all earning tx of today, any non-rejected status) */
  todayEarnings: function () {
    var k = Clock.todayKey(), t = 0, list = AppState.transactions;
    for (var i = 0; i < list.length; i++) {
      var tx = list[i];
      if (tx.day === k && EARNING_TYPES[tx.type] && tx.status !== "rejected") { t += tx.amount; }
    }
    return round2(t);
  },

  transactions: function () { return AppState.transactions; },
  withdrawals: function () { return AppState.withdrawals; },

  _addTx: function (type, amount, status, note) {
    AppState.transactions.unshift({
      id: uid("TX"), ts: Clock.now(), day: Clock.todayKey(),
      type: type, amount: round2(amount), status: status, note: note || ""
    });
    if (AppState.transactions.length > 150) { AppState.transactions.length = 150; }
  },

  /* Credit a reward as PENDING. It becomes withdrawable only after
   * verification (WalletService.settle in demo; the backend in production). */
  credit: function (type, amount, note) {
    /* SECURITY: in production this method does not exist client-side.
     * The backend credits the wallet AFTER it verifies the action. */
    amount = round2(amount);
    if (!(amount > 0)) { return; }
    AppState.wallet.pending = round2(AppState.wallet.pending + amount);
    WalletService._addTx(type, amount, "pending", note);
  },

  /* Spend from the withdrawable balance (character purchases etc.).
   * SECURITY: production must re-validate funds server-side. */
  spend: function (amount, type, note) {
    amount = round2(amount);
    if (AppState.wallet.withdrawable < amount) { return false; }
    AppState.wallet.withdrawable = round2(AppState.wallet.withdrawable - amount);
    WalletService._addTx(type, -amount, "completed", note);
    return true;
  },

  /* DEMO simulation of backend verification: pending earnings older than
   * APP_CONFIG.demo.verificationDelayMs become verified -> withdrawable.
   * PRODUCTION: the backend does this; the client only polls balances. */
  settle: function () {
    var delay = APP_CONFIG.demo.verificationDelayMs;
    var nowT = Clock.now(), changed = false, list = AppState.transactions;
    for (var i = 0; i < list.length; i++) {
      var tx = list[i];
      if (tx.status === "pending" && EARNING_TYPES[tx.type] && (nowT - tx.ts) >= delay) {
        tx.status = "verified";
        AppState.wallet.pending = round2(AppState.wallet.pending - tx.amount);
        AppState.wallet.withdrawable = round2(AppState.wallet.withdrawable + tx.amount);
        AppState.wallet.lifetimeVerified = round2(AppState.wallet.lifetimeVerified + tx.amount);
        changed = true;
      }
    }
    if (changed) { DemoState.save(); }
    return changed;
  },

  /* Lock funds for a withdrawal request (they stay locked until the
   * backend completes or rejects the request). */
  lockForWithdrawal: function (amount) {
    amount = round2(amount);
    if (AppState.wallet.withdrawable < amount) { return false; }
    AppState.wallet.withdrawable = round2(AppState.wallet.withdrawable - amount);
    return true;
  },

  /* DEMO: refund a rejected withdrawal (backend would do this server-side). */
  refundWithdrawal: function (wd) {
    AppState.wallet.withdrawable = round2(AppState.wallet.withdrawable + wd.amount);
  }
};

/* ==========================================================================
 * 13. CharacterService — roster, purchases, upgrades, boosts
 * --------------------------------------------------------------------------
 * Characters BOOST verified ad rewards only. They never generate money by
 * themselves. All definitions live in APP_CONFIG.characters so the backend
 * can own them later.
 *
 * SECURITY: purchases/upgrades must be validated and executed by the
 * backend in production (funds, level caps, ownership).
 * ========================================================================== */
var CharacterService = {

  list: function () { return APP_CONFIG.characters; },

  get: function (id) {
    var list = APP_CONFIG.characters;
    for (var i = 0; i < list.length; i++) { if (list[i].id === id) { return list[i]; } }
    return null;
  },

  isOwned: function (id) { return !!AppState.characters.owned[id]; },
  level: function (id) { return AppState.characters.owned[id] ? AppState.characters.owned[id].level : 0; },
  isActive: function (id) { return AppState.characters.activeId === id && CharacterService.isOwned(id); },
  active: function () {
    var def = CharacterService.get(AppState.characters.activeId);
    return def && CharacterService.isOwned(def.id) ? def : CharacterService.get("novice");
  },

  /* current boost % of a character (base + steps per level) */
  boostPercent: function (id) {
    var def = CharacterService.get(id || AppState.characters.activeId);
    if (!def) { return 0; }
    var lvl = CharacterService.level(def.id);
    if (lvl <= 0) { return 0; }
    return def.boostBase + (lvl - 1) * def.boostStep;
  },

  /* cost to reach the next level (null when maxed) */
  upgradeCost: function (id) {
    var def = CharacterService.get(id);
    if (!def) { return null; }
    var lvl = CharacterService.level(id);
    if (lvl <= 0 || lvl >= def.maxLevel) { return null; }
    return def.upgrades[lvl - 1];
  },

  /* applies the ACTIVE character's boost to a base ad reward */
  applyBoost: function (base) {
    var pct = CharacterService.boostPercent();
    return round2(base * (1 + pct / 100));
  },

  /* buy validation -> { ok, reason } */
  canBuy: function (id) {
    var def = CharacterService.get(id);
    if (!def) { return { ok: false, reason: "Unknown character." }; }
    if (CharacterService.isOwned(id)) { return { ok: false, reason: "Already unlocked." }; }
    if (def.requires && !CharacterService.isOwned(def.requires)) {
      var prev = CharacterService.get(def.requires);
      return { ok: false, reason: "Unlock " + (prev ? prev.name : def.requires) + " first." };
    }
    if (AppState.wallet.withdrawable < def.price) {
      return { ok: false, reason: "Not enough withdrawable balance (" + money(def.price) + " needed)." };
    }
    return { ok: true };
  },

  /* Buy flow — asks for confirmation first. Returns a Promise<bool>. */
  buy: function (id) {
    var check = CharacterService.canBuy(id);
    if (!check.ok) {
      UI.toast(check.reason, "error");
      return Promise.resolve(false);
    }
    var def = CharacterService.get(id);
    return UI.confirm({
      title: "Unlock " + def.name,
      bodyHtml:
        '<div class="center" style="padding:6px 0 2px">' +
          '<div style="display:inline-block;border-radius:20px;padding:8px;background:radial-gradient(circle,' + def.art.aura + '33,transparent 70%)">' + characterArt(def, 92) + "</div>" +
        "</div>" +
        '<div class="kv"><span>Rarity</span><b>' + rarityTag(def.rarity) + "</b></div>" +
        '<div class="kv"><span>Ad reward boost</span><b class="gold">+' + def.boostBase + "%</b></div>" +
        '<div class="kv"><span>Price</span><b>' + money(def.price) + "</b></div>" +
        '<p class="fineprint">' + esc(def.desc) + " Boost applies to verified ad rewards only.</p>",
      okText: def.price > 0 ? "Unlock \u2022 " + money(def.price) : "Unlock",
      okClass: "btn-gold"
    }).then(function (yes) {
      if (!yes) { return false; }
      /* re-check funds at execution time */
      if (AppState.wallet.withdrawable < def.price) {
        UI.toast("Not enough withdrawable balance.", "error");
        return false;
      }
      if (def.price > 0) {
        WalletService.spend(def.price, "character_purchase", "Unlocked " + def.name);
      }
      AppState.characters.owned[id] = { level: 1 };
      AppState.characters.activeId = id;
      commit();
      UI.hapticOk();
      UI.toast(def.name + " unlocked and set active!", "success");
      return true;
    });
  },

  upgrade: function (id) {
    var def = CharacterService.get(id);
    if (!def || !CharacterService.isOwned(id)) { return Promise.resolve(false); }
    var cost = CharacterService.upgradeCost(id);
    if (cost === null) { UI.toast("Already at max level.", "info"); return Promise.resolve(false); }
    if (AppState.wallet.withdrawable < cost) {
      UI.toast("Not enough withdrawable balance (" + money(cost) + " needed).", "error");
      return Promise.resolve(false);
    }
    var lvl = CharacterService.level(id);
    var newBoost = def.boostBase + lvl * def.boostStep;
    return UI.confirm({
      title: "Upgrade " + def.name,
      bodyHtml:
        '<div class="kv"><span>Level</span><b>' + lvl + " \u2192 " + (lvl + 1) + "</b></div>" +
        '<div class="kv"><span>Ad reward boost</span><b class="gold">+' + CharacterService.boostPercent(id) + "% \u2192 +" + newBoost + "%</b></div>" +
        '<div class="kv"><span>Cost</span><b>' + money(cost) + "</b></div>",
      okText: "Upgrade \u2022 " + money(cost),
      okClass: "btn-purple"
    }).then(function (yes) {
      if (!yes) { return false; }
      if (AppState.wallet.withdrawable < cost) { UI.toast("Not enough withdrawable balance.", "error"); return false; }
      WalletService.spend(cost, "character_upgrade", def.name + " \u2192 Lv " + (lvl + 1));
      AppState.characters.owned[id].level = lvl + 1;
      commit();
      UI.hapticOk();
      UI.toast(def.name + " upgraded to level " + (lvl + 1) + "!", "success");
      return true;
    });
  },

  setActive: function (id) {
    if (!CharacterService.isOwned(id)) { return; }
    AppState.characters.activeId = id;
    var def = CharacterService.get(id);
    commit();
    UI.hapticOk();
    UI.toast(def.name + " is now your active character!", "success");
  }
};

/* ==========================================================================
 * 14. RewardService — ads, daily bonus, streak, daily challenge
 * --------------------------------------------------------------------------
 * SECURITY: eligibility (ad limits, one-claim-per-day, streaks) MUST be
 * enforced server-side in production. The client versions here exist only
 * to drive the demo UI.
 * ========================================================================== */
var RewardService = {

  /* roll daily counters when the (demo) day changes */
  ensureDay: function () {
    var today = Clock.todayKey();
    if (AppState.ads.day !== today) { AppState.ads = { day: today, count: 0 }; }
    if (AppState.challenge.day !== today) { AppState.challenge = { day: today, claimed: false }; }
  },

  adsToday: function () { RewardService.ensureDay(); return AppState.ads.count; },
  adsLeft: function () { return Math.max(0, APP_CONFIG.dailyAdLimit - RewardService.adsToday()); },

  /* base + active character boost */
  adReward: function () { return CharacterService.applyBoost(APP_CONFIG.rewardPerAd); },

  /* ------- rewarded ad flow ------- */
  watchAd: function () {
    RewardService.ensureDay();
    if (AppState.ads.count >= APP_CONFIG.dailyAdLimit) {
      UI.toast("Daily ad limit reached \u2014 come back tomorrow!", "info");
      return;
    }
    UI.hapticOk();
    /* AdProvider decides whether an ad really completed. We only credit
     * after a verified result — never on button click. */
    AdProvider.startRewardedAd().then(function (result) {
      if (!result || !result.verified) {
        UI.toast("Ad not completed \u2014 no reward credited.", "info");
        UI.refresh();
        return;
      }
      /* PRODUCTION: send result.token to the backend; the backend
       * re-validates it with the ad network and credits the wallet. */
      var amount = RewardService.adReward();
      WalletService.credit("ad_reward", amount, "Rewarded ad (demo simulated)");
      AppState.ads.count += 1;
      RewardService._registerActivity();
      commit();
      UI.hapticOk();
      UI.toast("+" + money(amount) + " credited as pending \u2014 pending rewards are verified before withdrawal.", "success");
    }).catch(function () {
      UI.toast("Ad could not be started. Please try again.", "error");
      UI.refresh();
    });
  },

  /* ------- daily bonus (7-day track) ------- */
  canClaimBonus: function () {
    return AppState.bonus.lastClaimDay !== Clock.todayKey();
  },

  /* the day (1..7) the NEXT claim will land on */
  nextBonusDay: function () {
    var b = AppState.bonus;
    if (b.lastClaimDay === Clock.yesterdayKey() && b.dayIndex > 0) {
      return (b.dayIndex % 7) + 1;
    }
    return 1; /* streak broken or never claimed -> restart at day 1 */
  },

  bonusRewardFor: function (day) {
    return APP_CONFIG.dailyBonus.rewards[day - 1] || APP_CONFIG.dailyBonus.rewards[0];
  },

  claimBonus: function () {
    if (!RewardService.canClaimBonus()) {
      UI.toast("Daily bonus already claimed today.", "info");
      return;
    }
    var day = RewardService.nextBonusDay();
    var reward = RewardService.bonusRewardFor(day);
    WalletService.credit("daily_bonus", reward, "Daily bonus \u2014 day " + day);
    AppState.bonus = { lastClaimDay: Clock.todayKey(), dayIndex: day };
    RewardService._registerActivity();
    commit();
    UI.hapticOk();
    UI.toast("Day " + day + " bonus: +" + money(reward) + " (pending verification).", "success");
  },

  /* ------- streak -------
   * A streak day only counts after a QUALIFYING action (verified ad or
   * daily bonus claim). Refreshing the page never touches the streak. */
  _registerActivity: function () {
    var st = AppState.streak;
    var today = Clock.todayKey();
    if (st.lastDay === today) { return; } /* already qualified today */

    if (st.lastDay === Clock.yesterdayKey()) {
      st.current += 1;                    /* consecutive day */
    } else {
      st.current = 1;                     /* streak restarted */
      st.startDay = today;
    }
    st.lastDay = today;
    st.days[today] = true;
    if (st.current > st.best) { st.best = st.current; }

    /* milestone bonuses (credited once per streak, as pending) */
    var ms = APP_CONFIG.streak.milestones;
    for (var i = 0; i < ms.length; i++) {
      if (st.current === ms[i].day && st.milestones[String(ms[i].day)] !== st.startDay) {
        st.milestones[String(ms[i].day)] = st.startDay;
        WalletService.credit("streak_bonus", ms[i].reward, ms[i].day + "-day streak bonus");
        UI.toast(ms[i].day + "-day streak! +" + money(ms[i].reward) + " bonus.", "success");
      }
    }
  },

  streakQualifiedToday: function () {
    return AppState.streak.lastDay === Clock.todayKey();
  },

  /* ------- daily challenge ------- */
  challenge: function () {
    RewardService.ensureDay();
    return {
      count: AppState.ads.count,
      required: APP_CONFIG.challenge.adsRequired,
      done: AppState.ads.count >= APP_CONFIG.challenge.adsRequired,
      claimed: AppState.challenge.claimed
    };
  },

  claimChallenge: function () {
    var c = RewardService.challenge();
    if (c.claimed) { UI.toast("Challenge reward already claimed today.", "info"); return; }
    if (!c.done) { UI.toast("Watch " + (c.required - c.count) + " more ad(s) to complete the challenge.", "info"); return; }
    WalletService.credit("challenge_bonus", APP_CONFIG.challenge.reward, "Daily challenge completed");
    AppState.challenge.claimed = true;
    commit();
    UI.hapticOk();
    UI.toast("Challenge complete: +" + money(APP_CONFIG.challenge.reward) + " (pending verification).", "success");
  }
};

/* ==========================================================================
 * 16. WithdrawalService — requests & validation (DEMO)
 * --------------------------------------------------------------------------
 * The frontend only CREATES a request. It NEVER marks a withdrawal as
 * paid/completed — that happens in the backend/admin after review.
 * DEMO: requests stay "Pending" until the demo admin simulates a decision.
 * ========================================================================== */
var WithdrawalService = {

  draft: { method: "bKash", account: "", amount: "" }, /* in-memory form state */

  pendingCount: function () {
    var n = 0, list = AppState.withdrawals;
    for (var i = 0; i < list.length; i++) { if (list[i].status === "pending") { n++; } }
    return n;
  },

  history: function () { return AppState.withdrawals; },

  validate: function (form) {
    var errors = {};
    if (!form.method || APP_CONFIG.withdrawalMethods.indexOf(form.method) === -1) {
      errors.method = "Choose a withdrawal method.";
    }
    if (!/^[0-9]{11,14}$/.test(String(form.account).replace(/[\s-]/g, ""))) {
      errors.account = "Enter a valid account / mobile number (11\u201314 digits).";
    }
    var amt = round2(parseFloat(form.amount));
    if (!(amt > 0) || isNaN(amt)) { errors.amount = "Enter an amount."; }
    else if (amt < APP_CONFIG.minimumWithdrawal) { errors.amount = "Minimum withdrawal is " + money(APP_CONFIG.minimumWithdrawal) + "."; }
    else if (amt > AppState.wallet.withdrawable) { errors.amount = "Amount exceeds your withdrawable balance."; }
    else if (amt > ReferralService.limitInfo().current) { errors.amount = "Above your current withdrawal limit (" + money(ReferralService.limitInfo().current) + ")."; }
    if (WithdrawalService.pendingCount() >= APP_CONFIG.maxPendingWithdrawals) {
      errors.global = "You already have a withdrawal under review. Please wait for it to be processed.";
    }
    return errors;
  },

  /* Creates the request after user confirmation. Returns Promise<bool>. */
  request: function (form) {
    var errors = WithdrawalService.validate(form);
    var hasError = false, k;
    for (k in errors) { if (errors.hasOwnProperty(k)) { hasError = true; } }
    if (hasError) { return Promise.resolve({ ok: false, errors: errors }); }

    var amt = round2(parseFloat(form.amount));
    var masked = String(form.account).replace(/[\s-]/g, "");
    masked = masked.slice(0, 3) + "\u2022\u2022\u2022\u2022\u2022" + masked.slice(-3);

    return UI.confirm({
      title: "Confirm withdrawal",
      bodyHtml:
        '<div class="kv"><span>Method</span><b>' + esc(form.method) + "</b></div>" +
        '<div class="kv"><span>Account</span><b>' + masked + "</b></div>" +
        '<div class="kv"><span>Amount</span><b class="gold">' + money(amt) + "</b></div>" +
        '<div class="kv"><span>Processing</span><b>' + APP_CONFIG.processingEstimate + "</b></div>" +
        '<p class="fineprint">Requests are reviewed by our team. This demo build cannot send real payments \u2014 the request will stay <b>Pending</b> until the (future) backend processes it.</p>',
      okText: "Submit request",
      okClass: "btn-green"
    }).then(function (yes) {
      if (!yes) { return { ok: false, errors: {} }; }
      /* re-validate at execution time (funds may have changed) */
      var errs = WithdrawalService.validate(form);
      var bad = false, kk;
      for (kk in errs) { if (errs.hasOwnProperty(kk)) { bad = true; } }
      if (bad) { return { ok: false, errors: errs }; }

      if (!WalletService.lockForWithdrawal(amt)) {
        return { ok: false, errors: { amount: "Not enough withdrawable balance." } };
      }
      var wd = {
        id: uid("WD"), ts: Clock.now(),
        method: form.method, account: String(form.account).replace(/[\s-]/g, ""),
        amount: amt, status: "pending"
      };
      AppState.withdrawals.unshift(wd);
      WalletService._addTx("withdrawal", -amt, "pending", form.method + " \u2022 " + masked);
      /* PRODUCTION: POST this request to the backend; the backend owns
       * validation, fund locking and payout. Never mark it paid here. */
      commit();
      UI.hapticOk();
      return { ok: true, wd: wd };
    });
  },

  /* DEMO ADMIN ONLY: simulate the backend decision on a pending request. */
  decide: function (wdId, decision) {
    var list = AppState.withdrawals;
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === wdId && list[i].status === "pending") {
        list[i].status = decision; /* "completed" | "rejected" */
        if (decision === "rejected") { WalletService.refundWithdrawal(list[i]); }
        /* keep the matching withdrawal transaction in sync (display only) */
        var txs = AppState.transactions;
        for (var t = 0; t < txs.length; t++) {
          if (txs[t].type === "withdrawal" && txs[t].status === "pending" && Math.abs(txs[t].ts - list[i].ts) < 1500) {
            txs[t].status = (decision === "completed") ? "completed" : "rejected";
          }
        }
        DemoState.save();
        return true;
      }
    }
    return false;
  }
};

/* ==========================================================================
 * 18. UI — rendering core, router, modals, toasts, counters
 * ==========================================================================
 * - Hash-based routing (#/home, #/characters, ...) so the browser back
 *   button behaves naturally.
 * - One delegated click listener for the whole app (no listener leaks).
 * - Views are re-rendered only on navigation or state changes.
 * ========================================================================== */
var UI = {

  route: "home",
  tab: "home",          /* highlighted bottom-nav tab (sub-routes keep it) */
  _lastVals: {},        /* previous counter values (for animations)        */
  _renderedDay: "",     /* detect day rollover while app is open           */
  _confirmResolve: null,
  els: {},

  init: function () {
    UI.els.view = document.getElementById("view");
    UI.els.nav = document.getElementById("bottomnav");
    UI.els.modalRoot = document.getElementById("modal-root");
    UI.els.toastRoot = document.getElementById("toast-root");
    UI.els.adRoot = document.getElementById("ad-root");
    UI.els.splash = document.getElementById("splash");

    /* inject icons into the static bottom nav */
    var icons = UI.els.nav.querySelectorAll("[data-icon]");
    for (var i = 0; i < icons.length; i++) {
      icons[i].innerHTML = svgIcon(icons[i].getAttribute("data-icon"));
    }

    /* single delegated click listener for the whole document */
    document.addEventListener("click", function (ev) {
      var node = ev.target, hit = null;
      while (node && node !== document.body) {
        if (node.getAttribute) {
          var a = node.getAttribute("data-action");
          if (a) { hit = { el: node, action: a }; break; }
        }
        node = node.parentNode;
      }
      if (!hit) { return; }
      if (ev.preventDefault) { ev.preventDefault(); }
      var fn = Actions[hit.action];
      if (fn) { fn(hit.el, ev); }
    });

    /* close modal on Escape / backdrop */
    document.addEventListener("keydown", function (ev) {
      if ((ev.key === "Escape" || ev.keyCode === 27) && UI.els.modalRoot.firstChild) { UI.closeModal(); }
    });

    /* router */
    window.addEventListener("hashchange", function () { UI.onHashChange(); });

    /* light periodic tick: settle pending demo rewards, refresh countdowns,
       and roll daily counters if the day changed while the app was open. */
    setInterval(function () {
      RewardService.ensureDay();
      if (Clock.todayKey() !== UI._renderedDay) {
        UI.render(UI.route, true);
      } else if (WalletService.settle()) {
        UI.refresh();
      } else {
        UI.tickCountdowns();
      }
    }, 15000);

    UI.onHashChange(true);
    setTimeout(function () {
      if (UI.els.splash) {
        UI.els.splash.className = "hide";
        setTimeout(function () { if (UI.els.splash && UI.els.splash.parentNode) { UI.els.splash.parentNode.removeChild(UI.els.splash); } }, 600);
      }
    }, 950);
  },

  /* ---------- routing ---------- */
  navigate: function (route) {
    if (!VIEWS[route]) { route = "home"; }
    if (("#/" + route) === window.location.hash) { UI.render(route, true); return; }
    window.location.hash = "#/" + route; /* hashchange triggers render */
  },
  onHashChange: function (first) {
    var h = (window.location.hash || "#/home").replace("#/", "");
    var route = VIEWS[h] ? h : "home";
    if (["home", "characters", "earn", "partners", "profile"].indexOf(route) !== -1) {
      UI.tab = route;
    }
    UI.render(route, true);
    if (!first) { try { window.scrollTo(0, 0); } catch (e) {} }
  },

  render: function (route, animate) {
    if (UI.route !== route) { UI._prevRoute = UI.route; } /* for the in-app back button */
    UI.route = route;
    UI._renderedDay = Clock.todayKey();
    var html = VIEWS[route]();
    UI.els.view.className = "view" + (animate ? " anim" : "");
    UI.els.view.innerHTML = html;

    /* bottom-nav highlight */
    var items = UI.els.nav.children;
    for (var i = 0; i < items.length; i++) {
      var on = items[i].getAttribute("data-route") === UI.tab;
      items[i].className = "nav-item" + (on ? " active" : "");
    }
    UI.animateCounters();
    UI.tickCountdowns();
  },

  /* re-render current view without replaying the entrance animation */
  refresh: function () {
    if (!UI.els.view) { return; }
    var y = window.pageYOffset || 0;
    UI.render(UI.route, false);
    try { window.scrollTo(0, y); } catch (e) {}
  },

  /* ---------- animated number counters ---------- */
  animateCounters: function () {
    var els = UI.els.view.querySelectorAll("[data-count]");
    for (var i = 0; i < els.length; i++) {
      (function (el) {
        var key = el.getAttribute("data-count");
        var val = parseFloat(el.getAttribute("data-val")) || 0;
        var prev = UI._lastVals[key];
        UI._lastVals[key] = val;
        if (prev === undefined || prev === val || Math.abs(val - prev) < 0.005) {
          el.textContent = money(val);
          return;
        }
        var t0 = Date.now(), dur = 650, from = prev, to = val;
        function step() {
          var p = Math.min(1, (Date.now() - t0) / dur);
          var e = 1 - Math.pow(1 - p, 3); /* ease-out cubic */
          el.textContent = money(from + (to - from) * e);
          if (p < 1 && window.requestAnimationFrame) { window.requestAnimationFrame(step); }
          else { el.textContent = money(to); }
        }
        if (window.requestAnimationFrame) { window.requestAnimationFrame(step); } else { step(); }
      })(els[i]);
    }
  },

  /* elements with data-countdown="<targetTs>" show remaining time */
  tickCountdowns: function () {
    var els = document.querySelectorAll("[data-countdown]");
    var nowT = Clock.now();
    for (var i = 0; i < els.length; i++) {
      var target = parseInt(els[i].getAttribute("data-countdown"), 10);
      if (target > nowT) { els[i].textContent = fmtDur(target - nowT); }
      else if (els[i].getAttribute("data-cd-done")) { els[i].textContent = els[i].getAttribute("data-cd-done"); }
    }
  },

  /* ---------- toasts ---------- */
  toast: function (msg, type) {
    if (!UI.els.toastRoot) { return; }
    var t = document.createElement("div");
    t.className = "toast " + (type || "info");
    var icon = type === "success" ? "check" : (type === "error" ? "x" : "info");
    t.innerHTML = svgIcon(icon) + "<span>" + msg + "</span>";
    UI.els.toastRoot.appendChild(t);
    while (UI.els.toastRoot.children.length > 3) {
      UI.els.toastRoot.removeChild(UI.els.toastRoot.firstChild);
    }
    setTimeout(function () {
      t.className += " out";
      setTimeout(function () { if (t.parentNode) { t.parentNode.removeChild(t); } }, 320);
    }, 2700);
  },

  hapticOk: function () { window.TelegramAppBridge.haptic(); },

  /* ---------- modal ---------- */
  openModal: function (opts) {
    var html =
      '<div class="modal-backdrop" data-modal-backdrop="1">' +
        '<div class="modal" role="dialog" aria-label="' + esc(opts.title || "") + '">' +
          '<div class="modal-head"><div class="modal-title">' + esc(opts.title || "") + "</div>" +
          '<button class="modal-x" type="button" data-action="modal-close" aria-label="Close">' + svgIcon("x") + "</button></div>" +
          '<div class="modal-body">' + (opts.bodyHtml || "") + "</div>" +
        "</div>" +
      "</div>";
    UI.els.modalRoot.innerHTML = html;
    /* backdrop click closes (clicks inside the sheet are stopped above) */
    UI.els.modalRoot.firstChild.addEventListener("click", function (ev) {
      if (ev.target === this) { UI.closeModal(); }
    });
  },

  closeModal: function () {
    UI.els.modalRoot.innerHTML = "";
    if (UI._confirmResolve) {
      var r = UI._confirmResolve; UI._confirmResolve = null; r(false);
    }
  },

  /* promise-based confirmation dialog */
  confirm: function (opts) {
    return new Promise(function (resolve) {
      UI._confirmResolve = resolve;
      var html =
        '<div class="modal-backdrop" data-modal-backdrop="1">' +
          '<div class="modal" role="dialog" aria-label="' + esc(opts.title || "") + '">' +
            '<div class="modal-head"><div class="modal-title">' + esc(opts.title || "") + "</div>" +
            '<button class="modal-x" type="button" data-action="confirm-cancel" aria-label="Cancel">' + svgIcon("x") + "</button></div>" +
            '<div class="modal-body">' + (opts.bodyHtml || "") + "</div>" +
            '<div class="modal-actions">' +
              '<button class="btn btn-outline" type="button" data-action="confirm-cancel">Cancel</button>' +
              '<button class="btn ' + (opts.okClass || "btn-primary") + '" type="button" data-action="confirm-ok">' + esc(opts.okText || "Confirm") + "</button>" +
            "</div>" +
          "</div>" +
        "</div>";
      UI.els.modalRoot.innerHTML = html;
      UI.els.modalRoot.firstChild.addEventListener("click", function (ev) {
        if (ev.target === this) { UI.closeModal(); }
      });
    });
  }
};

var DemoAdUI = {
  _timer: null,

  show: function (callback) {
    if (DemoAdUI._cb) { callback({ verified: false, reason: "busy" }); return; }
    DemoAdUI._cb = callback;
    var secs = APP_CONFIG.demo.adDurationSec;
    var reward = RewardService.adReward();

    UI.els.adRoot.innerHTML =
      '<div class="ad-overlay">' +
        '<div class="ad-stage">' +
          '<span class="ad-badge">' + svgIcon("tv", "ic-sm") + " DEMO AD SIMULATION \u2014 NO REAL AD NETWORK</span>" +
          '<div class="ad-screen">' +
            '<i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>' +
            '<div class="ad-play">' + svgIcon("play", "ic-lg") + "</div>" +
            "<b>Simulated rewarded ad</b>" +
            "<small>Placeholder creative \u2014 for integration testing only</small>" +
          "</div>" +
          '<div class="ad-progress"><i id="ad-progress-bar"></i></div>' +
          '<div class="ad-status" id="ad-status">Reward unlocks in <span id="ad-count">0:0' + secs + "</span></div>" +
          '<p class="ad-note">In production this screen plays a real rewarded ad from the ad provider, and the reward is only credited after the backend verifies completion.</p>' +
          '<div class="ad-actions">' +
            '<button class="btn btn-outline" type="button" data-action="ad-cancel">' + svgIcon("x", "ic-sm") + " Close \u2022 no reward</button>" +
            '<button class="btn btn-gold" type="button" data-action="ad-collect" id="ad-collect-btn" disabled>' + svgIcon("gift", "ic-sm") + " Collect " + money(reward) + "</button>" +
          "</div>" +
        "</div>" +
      "</div>";

    var start = Date.now(), total = secs * 1000;
    DemoAdUI._timer = setInterval(function () {
      var elapsed = Date.now() - start;
      var p = Math.min(1, elapsed / total);
      var bar = document.getElementById("ad-progress-bar");
      var count = document.getElementById("ad-count");
      var status = document.getElementById("ad-status");
      var btn = document.getElementById("ad-collect-btn");
      if (bar) { bar.style.width = Math.round(p * 100) + "%"; }
      if (p >= 1) {
        clearInterval(DemoAdUI._timer); DemoAdUI._timer = null;
        if (count) { count.textContent = "0:00"; }
        if (status) { status.innerHTML = "Simulated ad completed \u2014 collect your reward"; }
        if (btn) { btn.disabled = false; }
      } else if (count) {
        var left = Math.ceil((total - elapsed) / 1000);
        count.textContent = "0:" + pad2(left);
      }
    }, 200);
  },

  _finish: function (result) {
    if (DemoAdUI._timer) { clearInterval(DemoAdUI._timer); DemoAdUI._timer = null; }
    var cb = DemoAdUI._cb;
    DemoAdUI._cb = null;
    UI.els.adRoot.innerHTML = "";
    if (cb) { cb(result); }
  }
};

 * ========================================================================== */
function statusChip(status) {
  var map = {
    pending:   ["clock", "warn", "Pending"],
    verified:  ["check", "info", "Verified"],
    completed: ["check", "ok",   "Completed"],
    rejected:  ["x",     "red",  "Rejected"]
  };
  var m = map[status] || ["info", "dim", status];
  return '<span class="chip ' + m[1] + '">' + svgIcon(m[0]) + " " + m[2] + "</span>";
}

function progressBar(pct, extra) {
  return '<div class="bar' + (extra ? " " + extra : "") + '"><div class="bar-fill' + (extra ? " " + extra : "") + '" style="width:' + clamp(Math.round(pct), 0, 100) + '%"></div></div>';
}

function txRow(tx) {
  var meta = TX_META[tx.type] || { label: tx.type, icon: "info", sign: +1 };
  var positive = tx.amount >= 0;
  return '<div class="tx-row">' +
    '<div class="tx-ico">' + svgIcon(meta.icon) + "</div>" +
    '<div class="tx-main"><div class="tx-title">' + esc(meta.label) + (tx.note ? " \u2022 " + esc(tx.note) : "") + '</div>' +
    '<div class="tx-date">' + fmtDateTime(tx.ts) + " \u2022 " + esc(tx.id) + "</div></div>" +
    '<div class="tx-amt"><b class="' + (positive ? "pos" : "neg") + '">' + (positive ? "+" : "") + money(tx.amount) + "</b>" +
    statusChip(tx.status) + "</div>" +
  "</div>";
}

function emptyState(icon, title, sub) {
  return '<div class="empty"><div class="e-ico">' + svgIcon(icon, "ic-lg") + "</div><b>" + esc(title) + "</b><span>" + esc(sub) + "</span></div>";
}

function txList(list, emptyTitle, emptySub) {
  if (!list || !list.length) { return emptyState("sparkles", emptyTitle, emptySub); }
  var out = "";
  for (var i = 0; i < list.length; i++) { out += txRow(list[i]); }
  return out;
}

/* ==========================================================================
 * 22. Actions — every data-action in the app maps to one handler
 * ========================================================================== */
var Actions = {

  /* navigation */
  "nav": function (el) { UI.navigate(el.getAttribute("data-route")); },
  /* in-app back: go to the previously viewed route (natural back),
     falling back to the browser history / home for deep links */
  "back": function () {
    if (UI._prevRoute && VIEWS[UI._prevRoute]) { UI.navigate(UI._prevRoute); }
    else if (window.history && window.history.length > 1) { window.history.back(); }
    else { UI.navigate("home"); }
  },
  "open-wallet": function () { UI.navigate("wallet"); },
  "open-withdraw": function () {
    if (WithdrawalService.pendingCount() >= APP_CONFIG.maxPendingWithdrawals) {
      UI.toast("You already have a withdrawal under review.", "info");
      return;
    }
    if (AppState.wallet.withdrawable < APP_CONFIG.minimumWithdrawal) {
      UI.toast("Withdrawable balance is below the " + money(APP_CONFIG.minimumWithdrawal) + " minimum.", "info");
      return;
    }
    UI.navigate("withdraw");
  },

  /* earning */
  "watch-ad": function () { RewardService.watchAd(); },
  "claim-bonus": function () { RewardService.claimBonus(); },
  "claim-challenge": function () { RewardService.claimChallenge(); },
  "ad-cancel": function () { DemoAdUI._finish({ verified: false, reason: "closed" }); },
  "ad-collect": function () {
    /* only enabled by the countdown after the simulated ad completes */
    DemoAdUI._finish({ verified: true, token: uid("demo-ad") });
  },

  /* characters */
  "char-buy": function (el) { CharacterService.buy(el.getAttribute("data-id")); },
  "char-upgrade": function (el) { CharacterService.upgrade(el.getAttribute("data-id")); },
  "char-activate": function (el) { CharacterService.setActive(el.getAttribute("data-id")); },

  /* partners */
  "copy-ref": function () {
    var link = ReferralService.link();
    copyText(link).then(function (ok) {
      if (ok) { UI.toast("Invite link copied to clipboard!", "success"); }
      else {
        UI.openModal({
          title: "Your invite link",
          bodyHtml: '<div class="ref-link" style="white-space:normal;word-break:break-all">' + esc(link) + "</div>" +
            '<p class="fineprint">Long-press (or select) the link above to copy it manually.</p>'
        });
      }
    });
  },
  "claim-ref-stage": function (el) { ReferralService.claimStage(parseInt(el.getAttribute("data-stage"), 10)); },

  /* wallet / withdrawal */
  "deposit": function () {
    UI.openModal({
      title: "Deposit",
      bodyHtml:
        '<div class="center" style="padding:4px 0 8px">' +
          '<div style="display:inline-block;padding:12px;border-radius:20px;background:rgba(255,201,60,.1);border:1px dashed rgba(255,201,60,.4);color:#ffd45c">' + svgIcon("coin", "ic-lg") + "</div>" +
        "</div>" +
        '<p class="small" style="color:#cfc7e8">Deposits are not part of this demo build. When the app connects to the payment backend, this screen will offer real top-up options.</p>' +
        '<p class="fineprint">No payment is requested or processed here \u2014 and no demo funds are added.</p>'
    });
  },
  "wd-method": function (el) {
    WithdrawalService.draft.method = el.getAttribute("data-method");
    var btns = document.getElementById("wd-methods") ? document.getElementById("wd-methods").children : [];
    for (var i = 0; i < btns.length; i++) {
      btns[i].className = (btns[i].getAttribute("data-method") === WithdrawalService.draft.method) ? "sel" : "";
    }
  },
  "withdraw-submit": function () {
    var acctEl = document.getElementById("wd-account");
    var amtEl = document.getElementById("wd-amount");
    var form = {
      method: WithdrawalService.draft.method,
      account: acctEl ? String(acctEl.value || "").trim() : "",
      amount: amtEl ? String(amtEl.value || "").trim() : ""
    };
    WithdrawalService.draft.account = form.account;
    WithdrawalService.draft.amount = form.amount;

    /* clear previous errors */
    var ids = ["method", "account", "amount", "global"];
    for (var i = 0; i < ids.length; i++) {
      var e = document.getElementById("wd-err-" + ids[i]);
      if (e) { e.className = "ferr"; e.textContent = ""; }
    }

    WithdrawalService.request(form).then(function (res) {
      if (res.ok) {
        WithdrawalService.draft.account = "";
        WithdrawalService.draft.amount = "";
        UI.navigate("wallet");
        UI.toast("Withdrawal request submitted \u2014 status: Pending review.", "success");
        return;
      }
      if (res.errors) {
        for (var k in res.errors) {
          if (!res.errors.hasOwnProperty(k)) { continue; }

/* clipboard helper with graceful fallback for old WebViews */
function copyText(text) {
  return new Promise(function (resolve) {
    try {
      if (window.navigator && window.navigator.clipboard && window.navigator.clipboard.writeText) {
        window.navigator.clipboard.writeText(text).then(function () { resolve(true); }, function () { resolve(legacyCopy(text)); });
        return;
      }
    } catch (e) {}
    resolve(legacyCopy(text));
  });
}
function legacyCopy(text) {
  try {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed"; ta.style.left = "-9999px"; ta.style.top = "0";
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    var ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return !!ok;
  } catch (e) { return false; }
}
